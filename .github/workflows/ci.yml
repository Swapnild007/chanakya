name: Chanakya CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate synthetic dataset and JavaScript syntax
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check prototype/classifier.js
          node --check prototype/app.js
          node tests/classifier.test.cjs
          node --check prototype/data.js
          node --check apps/command-center/app.js
          node --check apps/command-center/task-engine.js
          node --check apps/command-center/local-router.js
          node --check apps/command-center/conversation-store.js
          node --check apps/command-center/workflow-engine.js
          node --check apps/command-center/assistant-runtime.js
          node tests/task-engine.test.cjs
          node tests/conversation-store.test.cjs
          node tests/workflow-engine.test.cjs
          node tests/assistant-runtime.test.cjs
          node tests/local-router.test.cjs
